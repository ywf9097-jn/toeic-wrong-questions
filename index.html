<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多益錯題本</title>
<style>
:root{color-scheme:light;--bg:#ffffff;--card:#ffffff;--field:#f3f8fc;--ink:#17324d;--sub:#5f7a92;--line:#d3e2ee;--acc:#1e6bd6;--acc-t:#e6f0fc;--grn:#1f9d6b;--bad:#c23b3b;--bad-t:#fbeaea;--ok:#1f9d6b;--ok-t:#e3f5ec}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);border-top:5px solid var(--grn);font:16px/1.6 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:0 14px 60px;max-width:720px;margin:0 auto}
h1{font-size:22px;margin:18px 0 4px}
.stat{color:var(--sub);font-size:14px;margin-bottom:12px}
nav{display:flex;gap:6px;position:sticky;top:0;background:#fff;padding:8px 0;z-index:5}
nav button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
.hint{color:var(--sub);font-size:13px;margin-top:2px}
.btn{padding:10px 14px;border:1px solid var(--grn);background:var(--grn);color:#fff;border-radius:10px;font:inherit;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border-color:var(--acc)}
.btn.warn{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:focus-visible,nav button:focus-visible,.opt:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.letters{display:flex;gap:8px}
.letters label{margin:0;flex:1}
.letters input{display:none}
.letters span{display:block;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--field)}
.letters input:checked+span{background:var(--acc);color:#fff;border-color:var(--acc)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--acc-t);color:var(--acc)}
.tag.bad{background:var(--bad-t);color:var(--bad)}.tag.ok{background:var(--ok-t);color:var(--ok)}
.q{white-space:pre-wrap;margin:8px 0}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:inherit;cursor:pointer}
.opt.right{background:var(--ok-t);border-color:var(--ok)}
.opt.wrong{background:var(--bad-t);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.exp{white-space:pre-wrap;background:var(--field);border-radius:10px;padding:10px;margin-top:8px;font-size:15px}
.empty{color:var(--sub);text-align:center;padding:30px 10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
details summary{cursor:pointer;color:var(--acc);font-size:14px;margin-top:8px}
.hide{display:none}.seg{display:flex;gap:6px;margin-bottom:6px}.seg button{flex:1;padding:9px 4px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}.seg button.on{background:var(--grn);border-color:var(--grn);color:#fff}
</style>
</head>
<body>
<h1>多益錯題本</h1>
<div class="stat" id="stat"></div>
<nav id="nav">
  <button data-t="retake" class="on">重考</button>
  <button data-t="log">紀錄</button>
  <button data-t="backup">匯入/備份</button>
</nav>

<section id="log" class="hide">
  <div class="card">
    <div class="row" style="margin-top:0">
      <select id="fsrc" style="flex:1"></select>
      <select id="fst" style="flex:1"><option value="all">全部</option><option value="wrong">答錯</option><option value="right">答對</option><option value="guess">猜對</option><option value="todo">錯題未掌握</option><option value="done">已掌握</option></select>
    </div>
  </div>
  <div id="list"></div>
</section>

<section id="retake"><div id="rt"></div></section>

<section id="backup" class="hide">
  <div class="card">
    <b>批次貼上匯入</b>
    <p class="hint">一行一題，格式：<br>來源 / 題目 (A)選項 (B)選項 (C)選項 (D)選項 / 我的回答: C / 正確答案: A<br>行首的題號會自動忽略，重複的題目會跳過。雙選可寫「A、B」。</p>
    <textarea id="bt" style="min-height:160px" placeholder="把整份題目貼在這裡"></textarea>
    <div class="row"><button class="btn" id="bgo">匯入這些題目</button></div>
  </div>
  <div class="card">
    <b>匯出題目（Word / 文字檔）</b>
    <p class="hint">每題一行：來源 / 題目 (A)選項 (B)選項 (C)選項 (D)選項 / 我的回答: x / 正確答案: y<br>可以直接貼回「批次貼上匯入」。</p>
    <select id="escope"><option value="all">全部題目</option><option value="wrong">只有答錯的題目</option></select>
    <label style="font-weight:400"><input type="checkbox" id="enote" style="width:auto;margin-right:6px">在題目下方附上筆記（以 # 開頭，匯入時會略過）</label>
    <div class="row"><button class="btn" id="edocx">匯出 Word (.docx)</button><button class="btn ghost" id="etxt">匯出文字檔 (.txt)</button></div>
  </div>
  <div class="card">
    <p>資料只存在這個瀏覽器裡。換手機或清除瀏覽資料前，請先匯出備份。</p>
    <div class="row"><button class="btn" id="exp">匯出備份 (.json)</button><button class="btn ghost" id="impBtn">匯入備份</button></div>
    <input type="file" id="imp" accept="application/json" class="hide">
  </div>
</section>
<div class="toast" id="toast"></div>

<script>
(function(){
var KEY="toeic-mistakes-v1",L=["A","B","C","D","E"];
var data=[];
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){data=[]}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast("無法儲存，請先匯出備份")}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1800)}
function isWrong(e){return e.mine!==e.correct}
function weak(e){return isWrong(e)||!!e.guess}

/* AI explanation prompt */
function buildPrompt(e){
  var opts=e.options.map(function(o,i){return L[i]+". "+o}).join("\n");
  return "你是資深多益（TOEIC）老師。請用「中英對照」幫我解析下面這題，語氣簡潔、適合自學。\n\n"+
  "【來源】"+(e.source||"未填")+"\n【題目】\n"+e.question+"\n【選項】\n"+opts+
  "\n【我的答案】"+e.mine+"\n【正確答案】"+e.correct+"\n\n"+
  "請依序回答，每點都用「中文 / English」並列：\n"+
  "1. 考點觀念 Concept tested：這題考什麼（詞性、時態、介系詞、連接詞、片語、單字辨析、題型等），一句話點出，並說明多益常怎麼考這個觀念。\n"+
  "2. 為什麼正確答案是對的 Why it's correct：指出題目中的線索字（signal words）。\n"+
  "3. 我為什麼會錯 Why my answer is wrong："+(isWrong(e)?"說明我選的選項錯在哪、可能的思考陷阱。":"我答對了，請說明這題常見的陷阱，以及如何確認不是蒙對。")+"\n"+
  "4. 其他選項 Other options：逐一說明為什麼不選。\n"+
  "5. 題目翻譯 Translation：整題中譯，並附重點單字與片語（中英對照，3 到 5 個）。\n"+
  "6. 解題口訣 Quick tip：下次遇到同類題的 1 到 2 句判斷方法。\n"+
  "7. 同觀念練習 Practice：出 1 題同觀念的新題（多益格式，附選項），先不要給答案，等我回答。";
}
function copy(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast("已複製，去 Claude 貼上")},function(){fallback(text)});
  }else fallback(text);
}
function fallback(text){
  var t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();
  try{document.execCommand("copy");toast("已複製，去 Claude 貼上")}catch(e){toast("複製失敗，請手動選取")}
  document.body.removeChild(t);
}

/* tabs */
function show(t){
  ["retake","log","backup"].forEach(function(s){$(s).classList.toggle("hide",s!==t)});
  Array.prototype.forEach.call($("nav").children,function(b){b.classList.toggle("on",b.dataset.t===t)});
  if(t==="log")renderLog();
  if(t==="retake")startRetake();
}
$("nav").addEventListener("click",function(ev){var b=ev.target.closest("button");if(b)show(b.dataset.t)});

/* stats + sources */
function refresh(){
  var w=data.filter(isWrong).length,g=data.filter(function(e){return !isWrong(e)&&e.guess}).length,todo=data.filter(function(e){return weak(e)&&!e.mastered}).length;
  $("stat").textContent="共 "+data.length+" 題｜答錯 "+w+"｜猜對 "+g+"｜待加強 "+todo;
  var srcs=[];data.forEach(function(e){if(e.source&&srcs.indexOf(e.source)<0)srcs.push(e.source)});
  var cur=$("fsrc").value;
  $("fsrc").innerHTML='<option value="">所有來源</option>'+srcs.map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>'}).join("");
  $("fsrc").value=srcs.indexOf(cur)>=0?cur:"";
}

/* log */
function renderLog(){
  var s=$("fsrc").value,st=$("fst").value;
  var rows=data.filter(function(e){
    if(s&&e.source!==s)return false;
    if(st==="wrong")return isWrong(e);
    if(st==="right")return !isWrong(e);
    if(st==="guess")return !isWrong(e)&&!!e.guess;
    if(st==="todo")return weak(e)&&!e.mastered;
    if(st==="done")return e.mastered;
    return true;
  });
  if(!rows.length){$("list").innerHTML='<div class="empty">沒有符合的題目。到「新增」輸入第一題。</div>';return}
  $("list").innerHTML=rows.map(function(e){
    var w=isWrong(e);
    var opts=e.options.map(function(o,i){return '<div>'+L[i]+'. '+esc(o)+(L[i]===e.correct?' ✓':'')+(e.mine.indexOf(L[i])>=0&&w?' ✗':'')+'</div>'}).join("");
    return '<div class="card" data-id="'+e.id+'">'+
      '<span class="tag '+(w?'bad':'ok')+'">'+(w?'答錯':'答對')+'</span> '+(!w&&e.guess?'<span class="tag bad">猜對</span> ':'')+(e.mastered?'<span class="tag ok">已掌握</span> ':'')+
      '<span class="hint">'+esc(e.source||"未填來源")+'｜'+new Date(e.date).toLocaleDateString()+'</span>'+
      '<div class="q">'+esc(e.question)+'</div>'+opts+
      '<div class="hint">我選 '+e.mine+'，正解 '+e.correct+'</div>'+
      (e.explain?'<div class="exp">'+esc(e.explain)+'</div>':'')+
      '<div class="noteBox hide"><textarea data-act="exp" placeholder="寫下這題的筆記或貼上 Claude 的解析">'+esc(e.explain||"")+'</textarea></div>'+
      '<div class="row"><button class="btn ghost" data-act="note">'+(e.explain?'編輯筆記':'新增筆記')+'</button><button class="btn ghost" data-act="prompt">複製解析指令</button>'+
      (!w?'<button class="btn ghost" data-act="guess">'+(e.guess?'取消猜對標記':'標記為猜的')+'</button>':'')+(weak(e)?'<button class="btn ghost" data-act="master">'+(e.mastered?'取消掌握':'標記已掌握')+'</button>':'')+
      '<button class="btn warn" data-act="del">刪除</button></div></div>';
  }).join("");
}
$("fsrc").onchange=renderLog;$("fst").onchange=renderLog;
function find(id){return data.filter(function(e){return e.id===id})[0]}
$("list").addEventListener("click",function(ev){
  var b=ev.target.closest("button[data-act]");if(!b)return;
  var card=b.closest(".card"),e=find(card.dataset.id);if(!e)return;
  var a=b.dataset.act;
  if(a==="prompt")copy(buildPrompt(e));
  if(a==="note"){var nb=card.querySelector(".noteBox");nb.classList.toggle("hide");if(!nb.classList.contains("hide"))nb.querySelector("textarea").focus()}
  if(a==="guess"){e.guess=!e.guess;if(!e.guess)e.mastered=false;persist();refresh();renderLog()}
  if(a==="master"){e.mastered=!e.mastered;persist();refresh();renderLog()}
  if(a==="del"&&confirm("確定刪除這題？")){data=data.filter(function(x){return x!==e});persist();refresh();renderLog()}
});
$("list").addEventListener("change",function(ev){
  var t=ev.target;if(t.dataset.act!=="exp")return;
  var e=find(t.closest(".card").dataset.id);if(e){e.explain=t.value.trim();persist();toast("筆記已儲存");renderLog()}
});

/* retake */
var queue=[],cur=null,done=0,total=0,answered=false;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var lastN="",mode="wrong";
function poolFor(){return mode==="all"?data.slice():data.filter(function(e){return weak(e)&&!e.mastered})}
function startRetake(){
  var pool=poolFor(),box=$("rt");
  var seg='<div class="seg"><button data-m="wrong" class="'+(mode==="wrong"?"on":"")+'">只考錯題</button><button data-m="all" class="'+(mode==="all"?"on":"")+'">錯題＋對題</button></div>';
  if(!pool.length){queue=[];total=0;cur=null;box.innerHTML='<div class="card">'+seg+'<div class="empty">'+(mode==="all"?'還沒有題目，請到「匯入/備份」貼上題目。':'目前沒有待加強的錯題。')+'</div></div>';return}
  var opts="";
  for(var n=10;n<pool.length;n+=10)opts+='<option value="'+n+'">'+n+' 題</option>';
  opts+='<option value="all">全部 '+pool.length+' 題</option>';
  box.innerHTML='<div class="card">'+seg+'<p>'+(mode==="all"?'題庫共 ':'待加強的錯題共 ')+'<b>'+pool.length+'</b> 題。</p><label for="rn">這次要考幾題</label><select id="rn">'+opts+'</select><div class="row"><button class="btn" id="rgo">開始重考</button></div></div>';
  if(lastN&&$("rn").querySelector('option[value="'+lastN+'"]'))$("rn").value=lastN;
  $("rgo").onclick=function(){
    var v=$("rn").value;lastN=v;
    queue=shuffle(pool.slice());
    if(v!=="all")queue=queue.slice(0,parseInt(v,10));
    total=queue.length;done=0;next();
  };
}
function next(){
  cur=queue.shift()||null;answered=false;
  var box=$("rt");
  if(!cur){
    box.innerHTML='<div class="card empty">'+(total?'這一輪完成，共 '+total+' 題。':'目前沒有待加強的錯題。')+'<div class="row" style="justify-content:center">'+(total?'<button class="btn" id="again">回到選題數</button>':'')+'</div></div>';
    var ag=$("again");if(ag)ag.onclick=startRetake;return;
  }
  box.innerHTML='<div class="card"><div class="hint">'+(done+1)+' / '+total+'｜'+esc(cur.source||"未填來源")+'</div><div class="q">'+esc(cur.question)+'</div>'+
    cur.options.map(function(o,i){return '<button class="opt" data-l="'+L[i]+'">'+L[i]+'. '+esc(o)+'</button>'}).join("")+
    '<div id="reveal"></div></div>';
}
$("rt").addEventListener("click",function(ev){
  var sg=ev.target.closest("button[data-m]");
  if(sg){mode=sg.dataset.m;startRetake();return}
  var o=ev.target.closest(".opt");
  if(o&&cur&&!answered){
    answered=true;var pick=o.dataset.l,ok=pick===cur.correct;
    Array.prototype.forEach.call($("rt").querySelectorAll(".opt"),function(b){
      b.disabled=true;
      if(b.dataset.l===cur.correct)b.classList.add("right");
      else if(b.dataset.l===pick)b.classList.add("wrong");
    });
    cur.streak=ok?(cur.streak||0)+1:0;persist();
    $("reveal").innerHTML='<p><span class="tag '+(ok?'ok':'bad')+'">'+(ok?'答對':'答錯')+'</span> 正確答案 '+cur.correct+(ok&&cur.streak>1?'｜連續答對 '+cur.streak+' 次':'')+'</p>'+
      
      '<div class="row"><button class="btn ghost" data-r="prompt">複製解析指令</button>'+(ok&&weak(cur)&&!cur.mastered?'<button class="btn ghost" data-r="master">標記已掌握</button>':'')+'<button class="btn" data-r="next">下一題</button></div>';
    return;
  }
  var r=ev.target.closest("button[data-r]");if(!r||!cur)return;
  if(r.dataset.r==="prompt")copy(buildPrompt(cur));
  if(r.dataset.r==="master"){cur.mastered=true;persist();refresh();r.disabled=true;toast("已標記掌握")}
  if(r.dataset.r==="next"){done++;next()}
});

/* backup */
$("exp").onclick=function(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="toeic-mistakes-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
};
$("impBtn").onclick=function(){$("imp").click()};
$("imp").onchange=function(){
  var f=this.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var inc=JSON.parse(rd.result);if(!Array.isArray(inc))throw 0;
      var ids={};data.forEach(function(e){ids[e.id]=1});
      var n=0;inc.forEach(function(e){if(e&&e.id&&e.question&&!ids[e.id]){data.push(e);n++}});
      data.sort(function(a,b){return a.date<b.date?1:-1});
      persist();refresh();toast("匯入 "+n+" 題");
    }catch(e){toast("檔案格式不正確")}
  };
  rd.readAsText(f);this.value="";
};

/* batch paste */
function toLetter(raw,opts){
  raw=raw.trim();
  for(var i=0;i<opts.length;i++){if(opts[i].toLowerCase()===raw.toLowerCase())return L[i]}
  var m=raw.match(/[A-E]/g);return m?m.join("、"):raw;
}
function parseBatch(text){
  var out=[],bad=0;
  text.split(/\n+/).forEach(function(line){
    line=line.trim();if(!line||line.charAt(0)==="#")return;line=line.replace(/^\d+\s*[.、)]\s*/,"");
    var m=line.match(/^([^\/]*?)\s*\/\s*([\s\S]*?)\s*\/\s*我的回答\s*[:：]\s*([\s\S]*?)\s*\/\s*正確答案\s*[:：]\s*([\s\S]*)$/);
    if(!m){bad++;return}
    var body=m[2],pos=[],re=/\(([A-E])\)\s*/g,x;
    while((x=re.exec(body)))pos.push({i:x.index,e:re.lastIndex});
    if(pos.length<2){bad++;return}
    var q=body.slice(0,pos[0].i).trim().replace(/^\d+\.\s*/,"");
    var opts=pos.map(function(p,k){return body.slice(p.e,k+1<pos.length?pos[k+1].i:body.length).trim()});
    if(!q)q="(請看選項)";
    out.push({source:m[1].trim(),question:q,options:opts,mine:toLetter(m[3],opts),correct:toLetter(m[4],opts)});
  });
  return {rows:out,bad:bad};
}
$("bgo").onclick=function(){
  var r=parseBatch($("bt").value);
  if(!r.rows.length){toast("沒有讀到題目，請檢查格式");return}
  var seen={};data.forEach(function(e){seen[e.source+"|"+e.question]=1});
  var base=Date.now(),n=0,dup=0;
  r.rows.forEach(function(e,k){
    if(seen[e.source+"|"+e.question]){dup++;return}
    seen[e.source+"|"+e.question]=1;
    e.id=base.toString(36)+k+Math.random().toString(36).slice(2,5);
    e.date=new Date(base-k*1000).toISOString();e.mastered=false;e.streak=0;e.explain="";
    data.push(e);n++;
  });
  data.sort(function(a,b){return a.date<b.date?1:-1});
  persist();refresh();
  $("bt").value="";
  toast("匯入 "+n+" 題｜重複 "+dup+"｜格式錯誤 "+r.bad);
};

/* export */
function exportRows(){var sc=$("escope").value;return data.filter(function(e){return sc==="wrong"?isWrong(e):true})}
function stamp(){return new Date().toISOString().slice(0,10)}
function dl(blob,name){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a)}
function one(t){return String(t).replace(/\s*\n\s*/g," ")}
function lineOf(e){
  return (e.source||"未填")+" / "+one(e.question)+" "+e.options.map(function(o,k){return "("+L[k]+")"+one(o)}).join(" ")+" / 我的回答: "+e.mine+" / 正確答案: "+e.correct;
}
function exportLines(rows){
  var out=[],nt=$("enote").checked;
  rows.forEach(function(e){out.push(lineOf(e));if(nt&&e.explain)out.push("# 筆記: "+one(e.explain))});
  return out;
}
$("etxt").onclick=function(){
  var rows=exportRows();if(!rows.length){toast("沒有可匯出的題目");return}
  dl(new Blob(["\ufeff"+exportLines(rows).join("\n")+"\n"],{type:"text/plain;charset=utf-8"}),"toeic-questions-"+stamp()+".txt");
};
function crc32(b){var crc=-1,c;for(var i=0;i<b.length;i++){c=(crc^b[i])&255;for(var k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1;crc=(crc>>>8)^c}return(crc^-1)>>>0}
function le(n,len){var a=[];for(var i=0;i<len;i++){a.push(n&255);n=n>>>8}return a}
function zip(files){
  var enc=new TextEncoder(),chunks=[],cd=[],off=0;
  files.forEach(function(f){
    var nm=enc.encode(f.name),d=enc.encode(f.data),crc=crc32(d),n=Array.from(nm);
    var h=[].concat(le(0x04034b50,4),le(20,2),le(0,2),le(0,2),le(0,2),le(33,2),le(crc,4),le(d.length,4),le(d.length,4),le(nm.length,2),le(0,2));
    chunks.push(new Uint8Array(h),nm,d);
    cd=cd.concat(le(0x02014b50,4),le(20,2),le(20,2),le(0,2),le(0,2),le(0,2),le(33,2),le(crc,4),le(d.length,4),le(d.length,4),le(nm.length,2),le(0,2),le(0,2),le(0,2),le(0,2),le(0,4),le(off,4),n);
    off+=h.length+nm.length+d.length;
  });
  var end=[].concat(le(0x06054b50,4),le(0,2),le(0,2),le(files.length,2),le(files.length,2),le(cd.length,4),le(off,4),le(0,2));
  chunks.push(new Uint8Array(cd),new Uint8Array(end));
  return new Blob(chunks,{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
function xesc(t){return String(t).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function para(t,bold){return '<w:p><w:r>'+(bold?'<w:rPr><w:b/></w:rPr>':'')+'<w:t xml:space="preserve">'+xesc(t)+'</w:t></w:r></w:p>'}
$("edocx").onclick=function(){
  var rows=exportRows();if(!rows.length){toast("沒有可匯出的題目");return}
  var b="";
  exportLines(rows).forEach(function(t){b+=para(t)});
  var doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+b+'</w:body></w:document>';
  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  var rl='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  dl(zip([{name:"[Content_Types].xml",data:ct},{name:"_rels/.rels",data:rl},{name:"word/document.xml",data:doc}]),"toeic-questions-"+stamp()+".docx");
};

load();refresh();show("retake");
})();
</script>
