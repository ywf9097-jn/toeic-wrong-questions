<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOEIC Sentences</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#e4e4de;--ac:#2f6fed;--hl:#e8f0ff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#eeeeea;--mut:#9a9a94;--card:#202020;--bd:#33332f;--ac:#6b9bff;--hl:#1f2a40;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--fg:#eeeeea;--mut:#9a9a94;--card:#202020;--bd:#33332f;--ac:#6b9bff;--hl:#1f2a40;color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;line-height:1.45}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:16px;margin:0;flex:1}
button,select{font:inherit;color:var(--fg)}
.ctl{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:14px}
main{padding:10px 14px 30px;max-width:720px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row.on{background:var(--hl);border-color:var(--ac)}
.t{flex:1;min-width:0}
.w{font-size:12px;font-weight:600;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
.s{font-size:16px}
body.hide .t{visibility:hidden}
.c{flex:none;width:22px;height:22px;accent-color:var(--ac)}
.n{flex:none;min-width:26px;text-align:right;font-size:13px;font-weight:600;opacity:.6}
.row.done{opacity:.55}
.p{flex:none;width:42px;height:42px;border-radius:50%;border:none;background:var(--ac);color:#fff;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<header>
<h1>TOEIC Sentences</h1>
<select id="rate" class="ctl"><option value="0.8">Slow</option><option value="1" selected>Normal</option><option value="1.2">×1.2</option></select>
<button id="eye" class="ctl">Hide text</button>
<button id="all" class="ctl">▶ All</button>
<button id="stop" class="ctl">■</button>
</header>
<main id="list"></main>
<script>
const DATA=`Acquisition|The acquisition of the smaller firm was completed in March.

Emerge|New leaders often emerge during difficult times.
Exclusively|This offer is available exclusively to members.
Ideal|This location is ideal for a new restaurant.

Attribute|She attributes the project’s success to teamwork.
Substantially|Profits have increased substantially since last year.
Deserve|Our loyal customers deserve the best service.
Vital|Clear communication is vital to any team.
Agency|The travel agency arranged our hotel and flights.
Expire|Your membership will expire at the end of the month.
Appointment|I have an appointment with the dentist at three.
Distribute|Please distribute the agenda before the meeting.
Examine|Inspectors will examine all incoming shipments.
Impressed|The manager was impressed by her presentation.
Reception|The reception will be held in the main ballroom.`.split("\n").map(l=>l.split("|"));
const list=document.getElementById("list"),synth=window.speechSynthesis;
let voice=null,run=0,rows=[];
function pick(){const L=x=>x.lang.replace("_","-"),v=synth.getVoices().filter(x=>L(x).startsWith("en"));voice=v.find(x=>x.localService&&L(x)==="en-US")||v.find(x=>x.localService)||v.find(x=>L(x)==="en-US")||v[0]||null}
if(synth){pick();synth.onvoiceschanged=pick}
function mark(i){rows.forEach((r,j)=>r.classList.toggle("on",j===i))}
function speak(i,done){
  if(!synth)return;
  if(!voice)pick();
  const u=new SpeechSynthesisUtterance(DATA[i][1]);
  u.lang="en-US";if(voice)u.voice=voice;
  u.rate=parseFloat(document.getElementById("rate").value);
  u.onend=()=>{if(done)done()};
  u.onerror=e=>{if(e.error!=="canceled"&&e.error!=="interrupted")document.querySelector("h1").textContent="Audio error: "+e.error};
  mark(i);rows[i].scrollIntoView({block:"center",behavior:"smooth"});
  window._u=u;synth.resume();synth.speak(u);
}
function stop(){run++;if(synth)synth.cancel();mark(-1)}
function playOne(i){stop();setTimeout(()=>speak(i),120)}
function playAll(){
  stop();const id=run;let i=0;
  const next=()=>{if(id!==run||i>=DATA.length){mark(-1);return}speak(i++,()=>setTimeout(next,350))};
  setTimeout(next,150);
}
const KEY="chk:"+location.pathname;let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
DATA.forEach((d,i)=>{
  const r=document.createElement("div");r.className="row";
  r.innerHTML='<input type="checkbox" class="c" aria-label="Done"><span class="n"></span><div class="t"><div class="w"></div><div class="s"></div></div><button class="p" aria-label="Play">▶</button>';
  r.querySelector(".n").textContent=i+1;
  const cb=r.querySelector(".c");cb.checked=!!saved[i];r.classList.toggle("done",cb.checked);
  cb.onchange=()=>{saved[i]=cb.checked;r.classList.toggle("done",cb.checked);try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}};
  r.querySelector(".w").textContent=d[0];
  r.querySelector(".s").textContent=d[1];
  r.querySelector(".p").onclick=()=>playOne(i);
  list.appendChild(r);rows.push(r);
});
document.getElementById("all").onclick=playAll;
document.getElementById("stop").onclick=stop;
document.getElementById("eye").onclick=function(){const h=document.body.classList.toggle("hide");this.textContent=h?"Show text":"Hide text"};
</script>
</body>
</html>
